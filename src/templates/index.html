<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Passaporte Digital - LTD</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-[#f3f4f8] text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- ================= MODAL DE AUTENTICAÇÃO (CADASTRO / LOGIN) ================= -->
    <div id="auth-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl border border-slate-200 max-w-md w-full p-6 space-y-5">
            <div class="text-center space-y-1">
                <div class="w-12 h-12 bg-blue-600 text-white rounded-xl mx-auto flex items-center justify-center text-xl font-bold shadow-md">
                    <i class="fa-solid fa-passport"></i>
                </div>
                <h2 class="text-xl font-bold text-slate-900 pt-2" id="auth-title">Criar Conta - Passaporte LTD</h2>
                <p class="text-xs text-slate-500" id="auth-subtitle">Informe seus dados para iniciar sua jornada.</p>
            </div>

            <!-- Abas para alternar entre Cadastro e Login -->
            <div class="flex bg-slate-100 p-1 rounded-lg text-xs font-semibold">
                <button type="button" onclick="switchAuthTab('register')" id="tab-register" class="flex-1 py-2 rounded-md bg-white text-blue-600 shadow-sm transition">Cadastrar</button>
                <button type="button" onclick="switchAuthTab('login')" id="tab-login" class="flex-1 py-2 rounded-md text-slate-500 transition">Entrar</button>
            </div>

            <!-- Formulário Dinâmico -->
            <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
                <div id="name-field-container">
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Nome Completo</label>
                    <input type="text" id="auth-name" value="Ericka Vitória Aguiar Alves" placeholder="Ex: Maria Silva"
                        class="w-full px-3.5 py-2.5 text-xs rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-600">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">E-mail Cadastrado</label>
                    <input type="email" id="auth-email" required value="erickavitoria4@gmail.com" placeholder="seu@email.com"
                        class="w-full px-3.5 py-2.5 text-xs rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-600">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Senha</label>
                    <input type="password" id="auth-password" required placeholder="••••••••"
                        class="w-full px-3.5 py-2.5 text-xs rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-600">
                </div>
                <button type="submit" id="auth-btn"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-xs transition shadow-sm">
                    Cadastrar e Acessar <i class="fa-solid fa-arrow-right ml-1"></i>
                </button>
            </form>
            <p id="auth-error" class="text-xs text-red-500 text-center font-medium hidden"></p>
        </div>
    </div>

    <!-- HEADER SUPERIOR PRINCIPAL -->
    <header class="bg-white border-b border-slate-200 px-4 sm:px-8 py-4 flex flex-col sm:flex-row items-center justify-between gap-3 sticky top-0 z-10 shadow-sm">
        <div class="text-center sm:text-left">
            <h1 class="text-base sm:text-lg font-bold tracking-tight flex items-center justify-center sm:justify-start gap-2">
                <span class="text-red-600">Passaporte Digital</span> <span class="text-slate-400 font-light">-</span> <span class="text-slate-700">LTD</span>
            </h1>
            <p id="user-greeting" class="text-xs text-slate-500 font-medium pt-0.5">Olá, Aluno!</p>
        </div>

        <div class="flex items-center gap-4">
            <div class="bg-slate-50 border border-slate-200 px-3.5 py-1.5 rounded-lg flex items-center gap-2 text-xs font-semibold text-slate-600 shadow-sm">
                <span class="text-slate-500">Insígnias concluídas:</span>
                <span id="badges-count-badge" class="bg-blue-500 text-white px-2 py-0.5 rounded text-[11px]">3/7</span>
            </div>
            <button onclick="logout()" title="Sair" class="text-xs text-slate-500 hover:text-red-600 transition p-1">
                <i class="fa-solid fa-right-from-bracket text-sm"></i>
            </button>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="flex-1 max-w-[1400px] w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

        <!-- JORNADA DAS OFICINAS -->
        <section class="lg:col-span-8 space-y-4 order-2 lg:order-1">
            <div class="flex items-center justify-between">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500">
                    Sua Jornada
                </h2>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4" id="modules-grid"></div>
        </section>

        <!-- COLUNA DA DIREITA: RESGATE E PALAVRA-CHAVE -->
        <section class="lg:col-span-4 space-y-4 order-1 lg:order-2">
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 space-y-4">
                <div class="flex items-center gap-2 border-b border-slate-100 pb-3">
                    <span class="text-lg">👏</span>
                    <span class="text-xs font-bold text-slate-800 uppercase tracking-tight">Presença & Reação</span>
                </div>

                <form onsubmit="handleResgate(event)" class="space-y-4">
                    <!-- Oficina Ativa Atual -->
                    <div class="bg-blue-50/60 border border-blue-100 rounded-xl p-3 flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg bg-blue-600 text-white flex items-center justify-center text-xs shrink-0">
                            <i class="fa-solid fa-desktop"></i>
                        </div>
                        <div class="overflow-hidden">
                            <p class="text-[10px] text-slate-500 font-medium">Oficina Ativa:</p>
                            <p id="active-module-title" class="text-xs font-bold text-blue-900 truncate">Módulo 1 - Informática Básica</p>
                        </div>
                    </div>

                    <!-- Palavra-chave -->
                    <div class="space-y-1">
                        <label class="block text-xs font-semibold text-slate-700">Palavra-chave:</label>
                        <input type="text" id="keyword-input" required placeholder="Digite sua palavra-chave aqui..."
                            class="w-full px-3.5 py-2.5 text-xs rounded-xl border border-dashed border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-600 bg-slate-50/50">
                    </div>

                    <!-- Botão Enviar e Resgatar -->
                    <button type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-xl text-xs transition shadow-sm flex items-center justify-center gap-2">
                        <i class="fa-solid fa-paper-plane"></i> ENVIAR E RESGATAR
                    </button>
                </form>
            </div>
        </section>
    </div>

    <!-- SCRIPT DE GERENCIAMENTO -->
    <script>
        let usersDB = JSON.parse(localStorage.getItem('ltd_users')) || [];
        let currentUser = JSON.parse(localStorage.getItem('ltd_current_user')) || null;
        let currentMode = 'register';

        // Cores exatas conforme o seu projeto original da foto (Azul forte, Azul claro, Vermelho, Laranja, Rosa forte, etc.)
        const modulesData = [
            { id: 1, title: "MÓDULO 1 - INCLUSÃO DIGITAL E INFORMÁTICA BÁSICA", shortTitle: "Módulo 1 - Informática Básica", desc: "História e Evolução dos Computadores, Hardware e Software, Fundamentos de S.O., Teclado, Mouse e Arquivos.", color: "bg-[#2563eb]" }, // Azul Royal forte
            { id: 2, title: "MÓDULO 2 - PRODUTIVIDADE DIGITAL E EMPREGABILIDADE", shortTitle: "Módulo 2 - Produtividade", desc: "Editor de texto, Documentos e Formatação.", color: "bg-[#3b82f6]" }, // Azul intermediário
            { id: 3, title: "MÓDULO 3 - EDITORES DE TEXTO", shortTitle: "Módulo 3 - Editores", desc: "Formatação de documentos, elaboração de currículos e relatórios acadêmicos.", color: "bg-[#dc2626]" }, // Vermelho vivo
            { id: 4, title: "MÓDULO 4 - PLANILHAS ELETRÔNICAS", shortTitle: "Módulo 4 - Planilhas", desc: "Organização de dados, fórmulas essenciais, tabelas e gráficos dinâmicos.", color: "bg-[#ea580c]" }, // Laranja forte
            { id: 5, title: "MÓDULO 5 - APRESENTAÇÕES DE IMPACTO", shortTitle: "Módulo 5 - Apresentações", desc: "Criação de slides profissionais, estrutura visual e comunicação eficiente.", color: "bg-[#e11d48]" }, // Rosa/Vermelho escuro
            { id: 6, title: "MÓDULO 6 - LÓGICA DE PROGRAMAÇÃO", shortTitle: "Módulo 6 - Lógica", desc: "Algoritmos, estruturas condicionais e resolução de problemas práticos.", color: "bg-[#2563eb]" }, 
            { id: 7, title: "MÓDULO 7 - PROJETO FINAL & CARREIRA DIGITAL", shortTitle: "Módulo 7 - Projeto Final", desc: "Aplicação dos conhecimentos adquiridos, portfólio digital e certificação final.", color: "bg-[#3b82f6]" }
        ];

        function init() {
            if (currentUser) {
                document.getElementById('auth-modal').classList.add('hidden');
                document.getElementById('user-greeting').textContent = 'Olá, ' + currentUser.name + '!';
                updateActiveModuleInfo();
                renderModules();
            } else {
                document.getElementById('auth-modal').classList.remove('hidden');
            }
        }

        function switchAuthTab(mode) {
            currentMode = mode;
            const errEl = document.getElementById('auth-error');
            errEl.classList.add('hidden');
            
            if (mode === 'register') {
                document.getElementById('tab-register').className = "flex-1 py-2 rounded-md bg-white text-blue-600 shadow-sm transition";
                document.getElementById('tab-login').className = "flex-1 py-2 rounded-md text-slate-500 transition";
                document.getElementById('auth-title').textContent = "Criar Conta - Passaporte LTD";
                document.getElementById('auth-subtitle').textContent = "Informe seus dados para iniciar sua jornada.";
                document.getElementById('name-field-container').style.display = 'block';
                document.getElementById('auth-btn').textContent = "Cadastrar e Acessar";
            } else {
                document.getElementById('tab-login').className = "flex-1 py-2 rounded-md bg-white text-blue-600 shadow-sm transition";
                document.getElementById('tab-register').className = "flex-1 py-2 rounded-md text-slate-500 transition";
                document.getElementById('auth-title').textContent = "Acessar Passaporte - LTD";
                document.getElementById('auth-subtitle').textContent = "Entre com suas credenciais cadastradas.";
                document.getElementById('name-field-container').style.display = 'none';
                document.getElementById('auth-btn').textContent = "Entrar";
            }
        }

        function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('auth-email').value.trim().toLowerCase();
            const password = document.getElementById('auth-password').value;
            const nameInput = document.getElementById('auth-name').value.trim();
            const errEl = document.getElementById('auth-error');

            if (currentMode === 'register') {
                const existingUser = usersDB.find(u => u.email === email);
                if (existingUser) {
                    errEl.textContent = "Este e-mail já possui cadastro. Por favor, acesse a aba 'Entrar'.";
                    errEl.classList.remove('hidden');
                    return;
                }
                const newUser = { 
                    name: nameInput || "Aluno LTD", 
                    email: email, 
                    password: password, 
                    completedModules: [] 
                };
                usersDB.push(newUser);
                localStorage.setItem('ltd_users', JSON.stringify(usersDB));
                currentUser = newUser;
            } else {
                const foundUser = usersDB.find(u => u.email === email && u.password === password);
                if (!foundUser) {
                    errEl.textContent = "E-mail ou senha incorretos, ou usuário não cadastrado.";
                    errEl.classList.remove('hidden');
                    return;
                }
                currentUser = foundUser;
            }

            localStorage.setItem('ltd_current_user', JSON.stringify(currentUser));
            errEl.classList.add('hidden');
            init();
        }

        function logout() {
            localStorage.removeItem('ltd_current_user');
            currentUser = null;
            document.getElementById('auth-password').value = '';
            init();
            switchAuthTab('login');
        }

        function getActiveModule() {
            if (!currentUser.completedModules) currentUser.completedModules = [];
            for (let mod of modulesData) {
                if (!currentUser.completedModules.includes(mod.id)) {
                    return mod;
                }
            }
            return null;
        }

        function updateActiveModuleInfo() {
            const activeMod = getActiveModule();
            const titleEl = document.getElementById('active-module-title');
            if (activeMod) {
                titleEl.textContent = activeMod.shortTitle;
            } else {
                titleEl.textContent = "Parabéns! Todos os módulos concluídos.";
            }
        }

        function handleResgate(event) {
            event.preventDefault();
            const activeMod = getActiveModule();
            if (!activeMod) {
                alert("Você já concluiu todos os módulos!");
                return;
            }

            currentUser.completedModules.push(activeMod.id);
            
            usersDB = usersDB.map(u => u.email === currentUser.email ? currentUser : u);
            localStorage.setItem('ltd_users', JSON.stringify(usersDB));
            localStorage.setItem('ltd_current_user', JSON.stringify(currentUser));

            alert(`Insígnia do ${activeMod.shortTitle} resgatada com sucesso!`);
            
            document.getElementById('keyword-input').value = '';
            updateActiveModuleInfo();
            renderModules();
        }

        function renderModules() {
            const grid = document.getElementById('modules-grid');
            grid.innerHTML = '';
            
            let completedCount = currentUser.completedModules ? currentUser.completedModules.length : 0;
            document.getElementById('badges-count-badge').textContent = `${completedCount}/7`;

            const activeMod = getActiveModule();

            modulesData.forEach(mod => {
                const isConquered = currentUser.completedModules && currentUser.completedModules.includes(mod.id);
                const isActive = activeMod && activeMod.id === mod.id;
                
                let cardHTML = '';
                if (isConquered) {
                    cardHTML = `
                        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden flex flex-col justify-between">
                            <div class="${mod.color} p-6 flex flex-col justify-between text-white min-h-[140px]">
                                <span class="text-[11px] font-semibold opacity-95">Insígnia do Módulo ${mod.id}</span>
                            </div>
                            <div class="p-4 space-y-2 flex-1">
                                <h3 class="text-xs font-bold text-slate-800 uppercase leading-snug">${mod.title}</h3>
                                <p class="text-[11px] text-slate-500 leading-relaxed">${mod.desc}</p>
                            </div>
                            <div class="px-4 py-2.5 bg-emerald-500 text-white text-[11px] font-semibold flex items-center gap-1.5">
                                <i class="fa-regular fa-circle-check"></i> Insígnia conquistada
                            </div>
                        </div>`;
                } else if (isActive) {
                    cardHTML = `
                        <div class="bg-white rounded-xl border-2 border-blue-600 shadow-md overflow-hidden flex flex-col justify-between">
                            <div class="${mod.color} p-6 flex flex-col justify-between text-white min-h-[140px]">
                                <span class="text-[11px] font-semibold opacity-95">Insígnia do Módulo ${mod.id}</span>
                            </div>
                            <div class="p-4 space-y-2 flex-1">
                                <h3 class="text-xs font-bold text-slate-800 uppercase leading-snug">${mod.title}</h3>
                                <p class="text-[11px] text-slate-500 leading-relaxed">${mod.desc}</p>
                            </div>
                            <div class="px-4 py-2.5 bg-blue-50 border-t border-blue-100 text-blue-700 text-[11px] font-semibold flex items-center gap-1.5">
                                <i class="fa-regular fa-circle text-blue-500"></i> Oficina Ativa (Disponível para Resgate)
                            </div>
                        </div>`;
                } else {
                    cardHTML = `
                        <div class="bg-white/80 rounded-xl border border-slate-200 shadow-sm overflow-hidden opacity-75 flex flex-col justify-between ${mod.id === 7 ? 'sm:col-span-2' : ''}">
                            <div class="bg-slate-400 p-6 flex flex-col justify-between text-white min-h-[140px]">
                                <span class="text-[11px] font-semibold opacity-90"><i class="fa-solid fa-lock mr-1"></i> Insígnia do Módulo ${mod.id}</span>
                            </div>
                            <div class="p-4 space-y-2 flex-1">
                                <h3 class="text-xs font-bold text-slate-700 uppercase leading-snug">${mod.title}</h3>
                                <p class="text-[11px] text-slate-400 leading-relaxed">${mod.desc}</p>
                            </div>
                            <div class="px-4 py-2.5 bg-slate-100 text-slate-500 text-[11px] font-medium flex items-center gap-1.5">
                                <i class="fa-solid fa-lock"></i> Bloqueado
                            </div>
                        </div>`;
                }
                grid.innerHTML += cardHTML;
            });
        }

        window.onload = init;
    </script>
</body>

</html>
